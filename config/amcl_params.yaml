amcl:
  ros__parameters:
    use_sim_time: true

    # Motion model — DifferentialMotionModel approximates Ackermann well for flat terrain
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # Odometry noise parameters (tune after measuring real drift)
    alpha1: 0.2   # rotation noise from rotation
    alpha2: 0.2   # rotation noise from translation
    alpha3: 0.2   # translation noise from translation
    alpha4: 0.2   # translation noise from rotation
    alpha5: 0.2   # (unused in differential model)

    # Frames
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: sick_lms_291/scan    # resolved under namespace → /caddy_ai2/sick_lms_291/scan

    # Laser model
    laser_model_type: "likelihood_field"
    laser_max_range: 20.0
    laser_min_range: -1.0            # -1 = use sensor minimum
    max_beams: 60
    laser_likelihood_max_dist: 2.0
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1

    # Particle filter
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99

    # Update thresholds (Caddy AI2 moves slowly — lower values for better accuracy)
    update_min_d: 0.25              # metres
    update_min_a: 0.2               # radians

    # TF
    tf_broadcast: true
    transform_tolerance: 1.0
    save_pose_rate: 0.5
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""               # set via launch argument --map

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
